# Build and test the RubyTree library.
#
# The matrix runs the suite against both the json gem 2.x and 3.x, selected
# through the Gemfile variants in the gemfiles/ directory.
#
# This runs as a Github Action.

name: Build and Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / json ${{ matrix.json }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["2.7", "3.0", "3.1", "3.2", "3.3"]
        json: ["2", "3"]
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/json_${{ matrix.json }}.gemfile
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake clobber test:all gem:package
